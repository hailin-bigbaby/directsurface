name: Deploy example

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify:consumer
      - run: npm run procurement:setup
      - run: npm run procurement:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run procurement:test:browser
      - run: npm run procurement:test:production
      - run: GITHUB_PAGES=true npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .runtime/site
      - id: deployment
        uses: actions/deploy-pages@v4
